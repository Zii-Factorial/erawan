---
# ---------------------------------------------------------------------------
# Site-wide defaults — override via extra vars (-e) or host_vars as needed.
# Required vars (cluster_name, primary_ip, postgres_superuser_password,
# replication_password, patroni_admin_password, deployment_job_id) must be
# provided at runtime.
# ---------------------------------------------------------------------------

# PostgreSQL
# postgres_port: 5432
# postgres_superuser: postgres
# postgresql_cluster_name: main

# Patroni
# patroni_rest_port: 8008
# patroni_namespace: /db/
# patroni_admin_user: admin

# etcd
# etcd_client_port: 2379
# etcd_peer_port: 2380

# ---------------------------------------------------------------------------
# DCS mode — where Patroni keeps its cluster state.
#
# Empty control_plane_ip (the default) is the classic layout: one etcd per DB
# node, so the data plane itself has to carry an etcd quorum and a healthy
# cluster needs an odd number of nodes.
#
# When the Go runner passes control_plane_ip (SHARED_CONTROL_PLANE), Patroni
# instead uses the shared etcd on the control plane over TLS with a per-tenant
# user, and NO etcd is installed, started or verified on the DB nodes at all —
# which is what lets a 1- or 2-node PostgreSQL cluster be fully supported.
# PostgreSQL has no quorum mechanism of its own, so the quorum has to live
# somewhere; this moves it off the tenant's nodes onto infrastructure shared by
# every tenant.
#
# Every etcd-related task in these playbooks is gated on erawan_dcs_control_plane.
# ---------------------------------------------------------------------------
control_plane_ip: ""
control_plane_etcd_client_port: 2379
control_plane_etcd_user: ""
control_plane_etcd_password: ""
# The control plane's CA, as installed on each node by the shared
# control_plane_dcs_provision.yml playbook.
patroni_etcd_ca_path: /etc/patroni/etcd-ca.pem
erawan_dcs_control_plane: "{{ (control_plane_ip | default('') | trim) | length > 0 }}"

# App database (optional)
# new_user: ""
# new_db: ""
# new_user_password: ""
# new_user_ssl_required: true

# postgres_exporter — unlike postgres/patroni/etcd this has no distro package,
# so it must be pre-installed on the node image at this exact path. runtime_facts
# asserts it during preflight (Play 1) so a missing exporter fails fast instead
# of timing out deep into the deploy in the exporter-setup play.
postgres_exporter_bin: /usr/local/bin/postgres_exporter
# Defined here (not setup_exporters/defaults) so base_config's single UFW pass
# in Play 2 can open it too, instead of a second ufw-status round trip per node
# in the exporter-setup play.
postgres_exporter_port: 9187

# node_exporter ships pre-baked in the VM image (same as postgres_exporter),
# scraped directly by the erawan control plane — proxy_allowed_ip only.
node_exporter_port: 9100
