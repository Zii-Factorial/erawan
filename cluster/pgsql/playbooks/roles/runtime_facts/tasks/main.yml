---
- name: Gather hardware facts for PostgreSQL parameter sizing
  ansible.builtin.setup:
    gather_subset:
      - hardware
  when: ansible_memtotal_mb is not defined

# No built-in PostgreSQL equivalent of MySQL's innodb_dedicated_server, so
# these are derived from detected RAM using standard pgtune/EDB heuristics:
# shared_buffers 25% of RAM (≈128MB at 512MB RAM, matching PostgreSQL's own
# built-in default — no regression on the smallest CloudStack plan),
# effective_cache_size 75% (planner hint, not an allocation), maintenance_work_mem
# 10% capped at 1GB, work_mem (RAM - shared_buffers) / (16 * vCPUs) floored at
# PostgreSQL's own 4MB default and capped at 256MB as a safety valve.
- name: Compute PostgreSQL memory parameters from detected node resources
  ansible.builtin.set_fact:
    erawan_pg_shared_buffers_mb: "{{ ((ansible_memtotal_mb | default(512) | int) * postgres_shared_buffers_percent // 100) }}"
    erawan_pg_effective_cache_size_mb: "{{ ((ansible_memtotal_mb | default(512) | int) * postgres_effective_cache_size_percent // 100) }}"
    erawan_pg_maintenance_work_mem_mb: >-
      {{ [((ansible_memtotal_mb | default(512) | int) * postgres_maintenance_work_mem_percent // 100), postgres_maintenance_work_mem_ceiling_mb | int] | min }}
  when: erawan_pg_shared_buffers_mb is not defined

- name: Compute PostgreSQL work_mem from detected node resources
  ansible.builtin.set_fact:
    erawan_pg_work_mem_mb: >-
      {{ [
           [
             (((ansible_memtotal_mb | default(512) | int) - (erawan_pg_shared_buffers_mb | int))
               // (postgres_work_mem_cpu_divisor * (ansible_processor_vcpus | default(1) | int))),
             postgres_work_mem_floor_mb | int
           ] | max,
           postgres_work_mem_ceiling_mb | int
         ] | min }}
  when: erawan_pg_work_mem_mb is not defined

- name: Detect installed PostgreSQL major version
  ansible.builtin.shell: |
    set -euo pipefail
    psql --version | awk '{print $3}' | cut -d. -f1
  args:
    executable: /bin/bash
  register: pgsql_version
  changed_when: false
  failed_when: pgsql_version.rc != 0 or (pgsql_version.stdout | trim) == ""
  when: erawan_pg_major_version is not defined

- name: Store detected PostgreSQL major version
  ansible.builtin.set_fact:
    erawan_pg_major_version: "{{ pgsql_version.stdout | trim }}"
  when: erawan_pg_major_version is not defined

- name: Ensure Patroni binary is installed
  ansible.builtin.shell: command -v patroni
  args:
    executable: /bin/bash
  register: patroni_bin
  changed_when: false
  failed_when: patroni_bin.rc != 0 or (patroni_bin.stdout | trim) == ""
  when: erawan_patroni_bin_path is not defined

- name: Store detected Patroni binary path
  ansible.builtin.set_fact:
    erawan_patroni_bin_path: "{{ patroni_bin.stdout | trim }}"
  when: erawan_patroni_bin_path is not defined

- name: Ensure etcd binary is installed
  ansible.builtin.shell: command -v etcd
  args:
    executable: /bin/bash
  register: etcd_bin
  changed_when: false
  failed_when: etcd_bin.rc != 0 or (etcd_bin.stdout | trim) == ""
  when: erawan_etcd_bin_path is not defined

- name: Store detected etcd binary path
  ansible.builtin.set_fact:
    erawan_etcd_bin_path: "{{ etcd_bin.stdout | trim }}"
  when: erawan_etcd_bin_path is not defined

- name: Ensure PostgreSQL server binary exists
  ansible.builtin.stat:
    path: "/usr/lib/postgresql/{{ erawan_pg_major_version }}/bin/postgres"
  register: pgsql_server_bin
  failed_when: not pgsql_server_bin.stat.exists
  when: erawan_pg_bindir is not defined

# postgres_exporter has no distro package, so it can't be assumed present the
# way postgres/patroni/etcd are. Checked here (Play 1 preflight) rather than
# only in setup_exporters (Play 7) so a missing binary fails in seconds
# instead of after a 30s wait_for timeout deep into the deploy.
- name: Ensure postgres_exporter binary is installed
  ansible.builtin.stat:
    path: "{{ postgres_exporter_bin }}"
  register: postgres_exporter_bin_stat
  failed_when: not postgres_exporter_bin_stat.stat.exists
  when: erawan_postgres_exporter_checked is not defined

- name: Mark postgres_exporter binary as checked
  ansible.builtin.set_fact:
    erawan_postgres_exporter_checked: true
  when: erawan_postgres_exporter_checked is not defined

- name: Derive per-node PostgreSQL cluster facts
  ansible.builtin.set_fact:
    erawan_pg_node_id: "{{ (groups['all'] | list).index(inventory_hostname) + 1 }}"
    erawan_pg_node_name: "{{ 'node' ~ ((groups['all'] | list).index(inventory_hostname) + 1) }}"
  when: erawan_pg_node_name is not defined

- name: Derive PostgreSQL service and marker paths
  ansible.builtin.set_fact:
    erawan_pg_service_name: "{{ 'postgresql@' ~ erawan_pg_major_version ~ '-' ~ postgresql_cluster_name }}"
    erawan_pg_data_directory: "{{ '/var/lib/postgresql/' ~ erawan_pg_major_version ~ '/' ~ postgresql_cluster_name }}"
    erawan_pg_bindir: "{{ '/usr/lib/postgresql/' ~ erawan_pg_major_version ~ '/bin' }}"
    erawan_pg_reset_marker: "{{ '/var/lib/postgresql/.erawan-pgsql-reset-' ~ deployment_job_id ~ '-' ~ erawan_pg_node_name }}"
    erawan_etcd_reset_marker: "{{ '/var/lib/etcd/.erawan-etcd-reset-' ~ deployment_job_id ~ '-' ~ erawan_pg_node_name }}"
  when: erawan_pg_service_name is not defined
