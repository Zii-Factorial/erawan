---
# Start/recover is routinely called right after the nodes themselves were
# rebooted or recreated by a scale operation, and — unlike deploy — nothing
# ran preflight first: the first task used to SSH straight in and fail the
# whole job (UNREACHABLE / sudo prompt timeout) on a node that was seconds
# away from ready. Same manageability test as preflight (SSH + sudo + remote
# Python via the play's become); immediate no-op when nodes are already up.
- name: Wait for the node to become manageable
  tags: ["cluster_bootstrap"]
  block:
    - name: Wait for SSH connection and privilege escalation
      ansible.builtin.wait_for_connection:
        timeout: "{{ preflight_connect_timeout_seconds | default(300) }}"
        sleep: 2
  rescue:
    - name: Probe SSH and sudo layers separately
      ansible.builtin.raw: whoami && { sudo -n true && echo SUDO_OK || echo SUDO_FAIL; }
      become: false
      register: _bootstrap_conn_probe
      changed_when: false
      failed_when: false

    - name: Fail with connection diagnosis
      ansible.builtin.fail:
        msg: >-
          {% if _bootstrap_conn_probe.rc != 0 -%}
          Node {{ ansible_host }} is not reachable over SSH as
          {{ ansible_user | default('the configured user') }}:
          {{ _bootstrap_conn_probe.stderr | default('') | trim }}
          {%- elif 'SUDO_FAIL' in (_bootstrap_conn_probe.stdout | default('')) -%}
          SSH to {{ ansible_host }} works but passwordless sudo is not
          configured for the connecting user — node provisioning
          (cloud-init) is likely incomplete or misconfigured.
          {%- else -%}
          SSH and sudo work on {{ ansible_host }} but the Ansible Python
          test never succeeded — check that python3 is installed on the node.
          {%- endif %}

- name: Rediscover PostgreSQL runtime facts
  ansible.builtin.import_role:
    name: runtime_facts
  tags: ["cluster_bootstrap"]

# Start/recover often follows a scale operation that recreated node VMs —
# possibly with different IPs. The initial-cluster refresh below already
# reconciles etcd's CONFIG to current membership every run, but nothing
# reconciled the FIREWALL: peer-scoped UFW rules written at deploy/add-member
# time still list the old IPs, so a recreated peer's etcd (2380) traffic is
# dropped and the cluster sits at "RAFT NO LEADER" forever. Re-applying the
# shared peer-firewall role here (idempotent, no-op when UFW is inactive or
# rules already match) makes start/recover self-healing on this dimension,
# and must run BEFORE etcd starts so peer traffic is allowed when it does.
- name: Refresh peer firewall rules to current cluster membership
  ansible.builtin.import_role:
    name: pgsql_peer_firewall
  tags: ["cluster_bootstrap"]

# /var/run/postgresql lives on tmpfs, so a host reboot wipes it. base_config
# creates it at deploy time, but start/recover only runs this role — without
# it Postgres dies instantly at every Patroni start attempt (cannot create
# its socket lock file) and the "wait for port" below times out. Recreating
# it here makes start-after-reboot self-healing.
- name: Ensure PostgreSQL runtime socket directory exists
  ansible.builtin.file:
    path: /var/run/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: "2775"
  tags: ["cluster_bootstrap"]

# base_config disarms the OS-packaged PostgreSQL (postgresql@16-main et al.)
# exactly once, at deploy/add-member time — but start/recover only runs this
# role, on whatever disk the node currently has. On a node rebuilt from a
# stock image (e.g. a scale operation that recreates the VM instead of
# resizing it in place), that unit is enabled again and wins the boot race
# for the shared data directory, binding listen_addresses=localhost from
# /etc/postgresql/*/main/postgresql.conf. Patroni then ADOPTS that running
# postmaster instead of replacing it: it reports running/primary and rewrites
# the data-dir postgresql.conf to 0.0.0.0, but the live process never reads
# that file — leaving a healthy-looking node that HAProxy cannot reach.
# Re-disarming here is idempotent (no-op when base_config already did it)
# and makes start/recover self-healing on fresh disks: stopping the OS unit
# kills the wrongly-configured postmaster, and Patroni (re)starts Postgres
# with its own config, bound per patroni.yml.
- name: Stop OS-managed PostgreSQL service (Patroni owns Postgres)
  ansible.builtin.systemd:
    name: "{{ erawan_pg_service_name }}"
    state: stopped
    enabled: false
  failed_when: false
  tags: ["cluster_bootstrap"]

- name: Mask wrapper PostgreSQL service
  ansible.builtin.systemd:
    name: postgresql.service
    masked: true
  failed_when: false
  tags: ["cluster_bootstrap"]

# ── Shared control-plane DCS ────────────────────────────────────────────────
# With the control plane owning the DCS this node runs no etcd, so every etcd
# task below is skipped. What replaces them is one check: the CA must be on
# disk, or Patroni cannot open a TLS connection to the control plane and would
# fail here with a bare connection error a minute later. The CA is installed by
# the shared control_plane_dcs_provision.yml playbook, which the Go runner runs
# as the control_plane_dcs step of every deploy, start/recover and add-member —
# so a missing file means that step did not run, not a transient fault.
- name: Check the control-plane DCS CA is installed
  ansible.builtin.stat:
    path: "{{ patroni_etcd_ca_path }}"
  register: _erawan_dcs_ca_stat
  when: erawan_dcs_control_plane | bool
  tags: ["cluster_bootstrap"]

- name: Fail when the control-plane DCS CA is missing
  ansible.builtin.fail:
    msg: >-
      This cluster uses the shared control-plane DCS
      ({{ control_plane_ip }}:{{ control_plane_etcd_client_port }}) but
      {{ patroni_etcd_ca_path }} does not exist on {{ ansible_host }}, so
      Patroni cannot establish a TLS connection to it. Re-run the deploy or
      start/recover for this cluster: its control_plane_dcs step installs the
      CA and re-creates the tenant's etcd user.
  when:
    - erawan_dcs_control_plane | bool
    - not (_erawan_dcs_ca_stat.stat.exists | default(false))
  tags: ["cluster_bootstrap"]

- name: Check whether etcd data reset already ran for this job
  ansible.builtin.stat:
    path: "{{ erawan_etcd_reset_marker }}"
  register: erawan_etcd_reset_marker_stat
  when: not (erawan_dcs_control_plane | bool)
  tags: ["cluster_bootstrap"]

- name: Ensure etcd data directory is cleaned once per deployment job
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p /var/lib/etcd
    find /var/lib/etcd -mindepth 1 -maxdepth 1 -exec rm -rf {} +
    install -o root -g root -m 0600 /dev/null "{{ erawan_etcd_reset_marker }}"
  args:
    executable: /bin/bash
  when:
    - not (erawan_dcs_control_plane | bool)
    - not erawan_etcd_reset_marker_stat.stat.exists
  tags: ["cluster_bootstrap"]

# A full cluster stop/start (or a node that froze and got power-cycled) can
# leave an orphaned etcd process holding the bbolt file lock on
# /var/lib/etcd/member/snap/db without systemd knowing about it — systemd's
# own restart loop then keeps launching a new etcd that immediately exits 1
# ("cannot lock data directory"). Clearing any etcd not owned by the current
# unit before (re)starting makes this self-healing instead of a permanent
# crash loop.
- name: Kill any etcd process not tracked by systemd
  ansible.builtin.shell: |
    set -uo pipefail
    unit_pid=$(systemctl show -p MainPID --value etcd 2>/dev/null || echo 0)
    for pid in $(pgrep -f -- '--config-file={{ etcd_config_path }}'); do
      [ "$pid" = "$unit_pid" ] && continue
      kill -9 "$pid" 2>/dev/null || true
    done
    exit 0
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: not (erawan_dcs_control_plane | bool)
  tags: ["cluster_bootstrap"]

# A node's etcd.conf is rendered ONCE, at the moment it (or the file itself)
# was last written by base_config — at deploy time for original nodes, at
# add_member time for a joined node. Neither ever touches the OTHER members'
# files. etcd re-validates the local `initial-cluster` peer list against the
# cluster's actual current membership on every start where
# initial-cluster-state: existing — comparing peer COUNTS, not identity — so
# any node whose file predates a later add/remove-member fails immediately
# with "member count is unequal", even on an otherwise-healthy restart or a
# freshly re-provisioned node rejoining. Rewriting the line unconditionally,
# every run, to the control plane's own view of the current cluster (the
# Go-built inventory passed into this playbook, always accurate) keeps it in
# sync regardless of how many add/remove-member operations happened between
# writes — exactly the same formula base_config/templates/etcd.conf.j2 uses.
- name: Refresh initial-cluster peer list to the current cluster membership
  ansible.builtin.lineinfile:
    path: "{{ etcd_config_path }}"
    regexp: '^initial-cluster:'
    line: >-
      initial-cluster: "{% for host_name in groups['all'] %}{{ 'etcd' ~ ((groups['all'] | list).index(host_name) + 1) }}=http://{{ hostvars[host_name].ansible_host }}:{{ etcd_peer_port }}{% if not loop.last %},{% endif %}{% endfor %}"
  when: not (erawan_dcs_control_plane | bool)
  tags: ["cluster_bootstrap"]

# A data directory that is already initialized (member/ exists) ignores
# initial-cluster and initial-cluster-state entirely once past that count
# check, so once the peer list above is correct, forcing state=new here is a
# safe, idempotent way to skip the check on every subsequent restart of a
# node that has already joined — it only matters for a brand-new node's very
# first start (left as "existing" so peer discovery still runs for it, and
# for any node whose directory was freshly reset by the wipe above).
- name: Check whether this node's etcd data directory is already initialized
  ansible.builtin.stat:
    path: /var/lib/etcd/member
  register: erawan_etcd_member_dir_stat
  when: not (erawan_dcs_control_plane | bool)
  tags: ["cluster_bootstrap"]

- name: Skip stale initial-cluster-state validation on already-initialized nodes
  ansible.builtin.lineinfile:
    path: "{{ etcd_config_path }}"
    regexp: '^initial-cluster-state:'
    line: "initial-cluster-state: new"
  when:
    - not (erawan_dcs_control_plane | bool)
    - erawan_etcd_member_dir_stat.stat.exists
  tags: ["cluster_bootstrap"]

# block/rescue: this was the one bare systemd task in the role — when a
# scale-recreated node comes back with a snap-era disk (missing/renamed unit,
# missing binary, unit in a failed state), the module's one-line error died
# with the any_errors_fatal abort and left nothing to diagnose. Surface the
# unit state and journal like every other startup step here does.
- name: Start etcd on all nodes
  when: not (erawan_dcs_control_plane | bool)
  tags: ["cluster_bootstrap"]
  block:
    - name: Enable and start etcd service
      ansible.builtin.systemd:
        name: etcd
        enabled: true
        state: started
  rescue:
    - name: Collect etcd unit state on start failure
      ansible.builtin.command:
        argv: [systemctl, status, etcd, --no-pager, -l]
      register: _etcd_unit_status
      changed_when: false
      failed_when: false

    - name: Collect etcd journal on start failure
      ansible.builtin.command:
        argv: [journalctl, -u, etcd, --no-pager, -n, 80]
      register: _etcd_start_journal
      changed_when: false
      failed_when: false

    - name: Fail with etcd start context
      ansible.builtin.fail:
        msg: |
          systemctl start/enable of etcd failed on {{ inventory_hostname }}
          ({{ ansible_host }}): {{ ansible_failed_result.msg | default('(no module message)') }}
          Unit state:
          {{ _etcd_unit_status.stdout | default('(no status output)') }}
          Last 80 etcd journal lines:
          {{ _etcd_start_journal.stdout | default('(no journal output)') }}

# block/rescue mirrors the Patroni pattern below: capture the journal whether
# the port-open wait or the health poll times out, so a crash-looping etcd
# (exit 1 in a restart-on-failure loop) reports its real error instead of a
# bare timeout that requires manual SSH to diagnose.
- name: Wait for etcd to accept connections and report healthy
  when: not (erawan_dcs_control_plane | bool)
  tags: ["cluster_bootstrap"]
  block:
    - name: Wait for local etcd client port
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ etcd_client_port }}"
        state: started
        timeout: 90

    - name: Wait for etcd to become healthy on each node
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ etcd_client_port }}/health"
        return_content: true
      register: etcd_health
      until: etcd_health.status == 200 and ('true' in (etcd_health.content | lower))
      retries: 60
      delay: 1
      changed_when: false
  rescue:
    - name: Collect etcd journal on bootstrap failure
      ansible.builtin.command:
        argv: [journalctl, -u, etcd, --no-pager, -n, 80]
      register: _etcd_journal
      changed_when: false
      failed_when: false

    - name: Fail with etcd log context
      ansible.builtin.fail:
        msg: |
          etcd failed to become healthy on {{ inventory_hostname }}.
          Last 80 etcd journal lines:
          {{ _etcd_journal.stdout | default('(no journal output)') }}
      when: inventory_hostname not in groups['pgsql_primary']

    # On the primary, an unhealthy etcd after a start is very often quorum
    # lost to a stale voter: a node registered by a half-finished add-member
    # and then destroyed without remove-member. The shared role recovers with
    # force-new-cluster when that is provably safe (all unexpected voters are
    # dead, no live standby would be orphaned) and fails with guidance
    # otherwise — instead of a bare health timeout.
    - name: Build expected cluster node list
      ansible.builtin.set_fact:
        _etcd_expected_ips: "{{ ([primary_ip] + (standby_ips | default([]))) | unique }}"
      when: inventory_hostname in groups['pgsql_primary']

    - name: Attempt stale-voter quorum recovery on the primary
      ansible.builtin.include_role:
        name: etcd_recover_quorum
      when: inventory_hostname in groups['pgsql_primary']

    - name: Re-check etcd health after quorum recovery
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ etcd_client_port }}/health"
        return_content: true
      register: _etcd_health_recheck
      until: _etcd_health_recheck.status == 200 and ('true' in (_etcd_health_recheck.content | lower))
      retries: 30
      delay: 1
      changed_when: false
      when: inventory_hostname in groups['pgsql_primary']

- name: Start Patroni on the requested primary node
  ansible.builtin.systemd:
    name: patroni
    enabled: true
    state: started
  when: inventory_hostname in groups['pgsql_primary']
  tags: ["cluster_bootstrap"]

# block/rescue ensures journal is collected whether the port-open wait or the
# cluster-state poll times out first.
- name: Bootstrap Patroni primary and verify the cluster has a leader
  when: inventory_hostname in groups['pgsql_primary']
  tags: ["cluster_bootstrap"]
  block:
    - name: Wait for Patroni REST port to open on primary
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ patroni_rest_port }}"
        state: started
        timeout: "{{ patroni_port_open_timeout }}"

    # What bootstrap has to establish is that the CLUSTER has a leader and that
    # this node has joined it — not that this particular node won the election.
    #
    # primary_ip is the *stored* primary from the portal spec, and nothing
    # updates it after a failover. A scale operation reboots that VM, the lock
    # expires, another member wins it, and on the next start this node correctly
    # follows the live leader rather than fencing it. Polling /leader here (200
    # only on the lock holder) called that healthy cluster a failure — after
    # burning the whole retry budget, five minutes, on a cluster that was
    # already up. verify_cluster discovers the leader for the same reason.
    #
    # /cluster is served from the DCS by any member, so this stays on the host
    # the play is already on. `host` is the member's IP, as in verify_cluster.
    #
    # The wait is split into a grace poll and the rest of the budget so a cluster that
    # provably cannot elect a leader is called after ~60s instead of five
    # minutes. failed_when: false keeps an exhausted grace poll from ending the
    # block — the diagnosis below decides whether waiting longer is useful.
    - name: Wait for a leader to be elected and this node to join the cluster
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ patroni_rest_port }}/cluster"
        return_content: true
      register: _patroni_cluster
      until: >-
        ((_patroni_cluster.json | default({})).members | default([])
         | selectattr('role', 'in', ['leader', 'standby_leader'])
         | list | length > 0)
        and
        ((_patroni_cluster.json | default({})).members | default([])
         | selectattr('host', 'equalto', ansible_host)
         | selectattr('state', 'in', ['running', 'streaming'])
         | list | length > 0)
      retries: "{{ patroni_leader_grace_retries }}"
      delay: "{{ patroni_leader_delay }}"
      changed_when: false
      failed_when: false

    - name: Summarise the cluster view
      ansible.builtin.set_fact:
        _cv_members: "{{ (_patroni_cluster.json | default({})).members | default([]) }}"

    # `stopped` is Patroni reporting that it has DECIDED not to start Postgres.
    # It is none of the states a slow bootstrap passes through (`initializing
    # new cluster`, `starting`, `creating replica`) and none of the states a
    # failed start reports (`start failed`, `crashed`) — it is the signature of
    # a node that believes the cluster is already initialised in the DCS and is
    # waiting to clone from a leader. With no leader in the member list there is
    # nothing to clone from and nothing that resolves by waiting, so the rest of
    # the budget would buy the same answer four minutes later.
    #
    # The usual cause is DCS state left behind by an earlier incarnation of the
    # same cluster name: the tenant prefix still holds `initialize` (and a
    # system identifier that does not match this node's fresh data directory),
    # so Patroni refuses to bootstrap over it. Nothing clears that prefix except
    # the DCS cleanup endpoint.
    - name: Diagnose a cluster that cannot elect a leader
      ansible.builtin.set_fact:
        _bootstrap_diagnosis: >-
          No member holds the leader lock and this node reports state
          `stopped` — Patroni is up and reading the DCS, but has decided not to
          start PostgreSQL and has no leader to clone from. On a cluster this
          size nothing else can take the lock, so this does not resolve by
          waiting. The usual cause is DCS state left over from an earlier
          cluster of the same name: check
          `etcdctl get --prefix {{ patroni_namespace }}{{ patroni_scope }}/ --keys-only`
          {{ 'on the shared control plane' if (erawan_dcs_control_plane | bool)
             else 'against this node etcd' }}
          for an `initialize` key with no `leader` beside it, against a node
          whose data directory is empty. Clearing that prefix
          {{ '(the DELETE /cluster/pgsql/dcs endpoint)' if (erawan_dcs_control_plane | bool)
             else '(etcdctl del --prefix, on a cluster that is provably dead)' }}
          lets the next deploy bootstrap. If the data directory is NOT empty,
          the journal below is the authority — treat this as a PostgreSQL start
          failure instead.
      when:
        - (_cv_members | selectattr('role', 'in', ['leader', 'standby_leader'])
                       | list | length) == 0
        - (_cv_members | selectattr('host', 'equalto', ansible_host)
                       | selectattr('state', 'equalto', 'stopped')
                       | list | length) > 0

    - name: Fail fast on a cluster that cannot elect a leader
      ansible.builtin.fail:
        msg: "{{ _bootstrap_diagnosis }}"
      when: _bootstrap_diagnosis is defined

    # Still moving, or in a state that a slow node legitimately passes through:
    # spend what is left of the ceiling before giving up.
    - name: Wait out the rest of the leader-election budget
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ patroni_rest_port }}/cluster"
        return_content: true
      register: _patroni_cluster
      until: >-
        ((_patroni_cluster.json | default({})).members | default([])
         | selectattr('role', 'in', ['leader', 'standby_leader'])
         | list | length > 0)
        and
        ((_patroni_cluster.json | default({})).members | default([])
         | selectattr('host', 'equalto', ansible_host)
         | selectattr('state', 'in', ['running', 'streaming'])
         | list | length > 0)
      retries: "{{ [(patroni_leader_retries | int) - (patroni_leader_grace_retries | int), 1] | max }}"
      delay: "{{ patroni_leader_delay }}"
      changed_when: false
      when: >-
        not ((_cv_members | selectattr('role', 'in', ['leader', 'standby_leader'])
                          | list | length > 0)
             and (_cv_members | selectattr('host', 'equalto', ansible_host)
                             | selectattr('state', 'in', ['running', 'streaming'])
                             | list | length > 0))

    # Which member actually holds the lock, for the log and for anything after
    # this role that would otherwise assume it is primary_ip.
    - name: Record the elected leader
      ansible.builtin.set_fact:
        patroni_leader_ip: >-
          {{ (_patroni_cluster.json | default({})).members | default([])
             | selectattr('role', 'in', ['leader', 'standby_leader'])
             | map(attribute='host', default=primary_ip)
             | first | default(primary_ip) }}

    - name: Report the elected leader
      ansible.builtin.debug:
        msg: >-
          Cluster leader is {{ patroni_leader_ip }}
          {{ '(the stored primary)' if patroni_leader_ip == primary_ip
             else '— the stored primary ' ~ primary_ip ~ ' is a replica of it' }}
  rescue:
    - name: Collect Patroni journal on primary bootstrap failure
      ansible.builtin.command:
        argv: [journalctl, -u, patroni, --no-pager, -n, 80]
      register: _patroni_journal
      changed_when: false
      failed_when: false

    - name: Fail with Patroni log context
      ansible.builtin.fail:
        msg: |
          {% if _bootstrap_diagnosis is defined -%}
          {{ _bootstrap_diagnosis }}
          {%- else -%}
          The cluster did not reach a healthy state from {{ inventory_hostname }}:
          either no member won the leader lock, or this node never joined as a
          running member. A node reporting itself a secondary following another
          leader is NOT this failure — that is a healthy cluster.
          {%- endif %}
          Last Patroni cluster view: {{ (_patroni_cluster | default({})).json | default('(not reached)') }}
          Last 80 Patroni journal lines:
          {{ _patroni_journal.stdout | default('(no journal output)') }}

# block/rescue mirrors the leader-election pattern above: if Postgres never
# opens its port (e.g. it is crash-looping at startup), surface the Patroni
# journal — which captures Postgres stdout/stderr — instead of a bare timeout.
- name: Wait for PostgreSQL to accept connections on primary
  when: inventory_hostname in groups['pgsql_primary']
  tags: ["cluster_bootstrap"]
  block:
    - name: Wait for PostgreSQL to listen on primary
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ postgres_port }}"
        state: started
        timeout: 180
  rescue:
    - name: Collect Patroni journal on primary PostgreSQL startup failure
      ansible.builtin.command:
        argv: [journalctl, -u, patroni, --no-pager, -n, 80]
      register: _pg_primary_journal
      changed_when: false
      failed_when: false

    - name: Fail with PostgreSQL startup log context
      ansible.builtin.fail:
        msg: |
          PostgreSQL did not open port {{ postgres_port }} on {{ inventory_hostname }}.
          Last 80 Patroni journal lines:
          {{ _pg_primary_journal.stdout | default('(no journal output)') }}

# Enforce synchronous_mode via the Patroni REST API so this takes effect on
# both fresh clusters (redundant with bootstrap.dcs but harmless) and on
# existing clusters whose DCS config pre-dates the synchronous_mode setting.
# max_connections rides along for the same reason: bootstrap.dcs only applies
# on a brand-new cluster, while this PATCH also covers DCS state that survived
# from an earlier bootstrap.
- name: Set synchronous_mode in Patroni DCS
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ patroni_rest_port }}/config"
    method: PATCH
    body_format: json
    body: >-
      {{ {'synchronous_mode': true, 'synchronous_mode_strict': false}
         | combine({'postgresql': {'parameters': {'max_connections': postgres_max_connections | int}}}
                   if (postgres_max_connections | default(0) | int) > 0 else {}) }}
    status_code: [200]
  when: inventory_hostname in groups['pgsql_primary']
  tags: ["cluster_bootstrap"]

# pg_hba entries are pinned to member IPs since the proxy-IP restriction, and
# a scale-recreated node can come back with a DIFFERENT IP — the DCS pg_hba
# (or the bootstrap-time pg_hba.conf) then lacks it and that node's streaming
# replication is rejected forever. Reconcile here so start/recover heals it,
# mirroring add_member's refresh play. bootstrap.pg_hba never lands in the
# DCS, so when /config has no pg_hba the baseline is seeded from the
# primary's live pg_hba.conf — never from an empty default, which would
# REPLACE the effective pg_hba everywhere with only the appended lines.
- name: Get current Patroni DCS config for pg_hba reconciliation
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ patroni_rest_port }}/config"
    return_content: true
    status_code: 200
  register: _bootstrap_patroni_config
  no_log: true
  when: inventory_hostname in groups['pgsql_primary']
  tags: ["cluster_bootstrap"]

# Patroni manages pg_hba.conf inside the data directory, so root reads it
# straight off disk — a psql "SHOW hba_file" round-trip proved fragile here
# (Debian's wrapper resolved the wrong port; become_user ran as root under
# pipelining) and the file location is already known from runtime_facts.
- name: Read the primary's live pg_hba.conf
  ansible.builtin.slurp:
    src: "{{ erawan_pg_data_directory }}/pg_hba.conf"
  register: _bootstrap_hba_file
  no_log: true
  when:
    - inventory_hostname in groups['pgsql_primary']
    - (_bootstrap_patroni_config.json.postgresql.pg_hba | default([])) | length == 0
  tags: ["cluster_bootstrap"]

- name: Resolve pg_hba baseline and entries missing from it
  ansible.builtin.set_fact:
    _bootstrap_pg_hba_base: "{{ _hba_base }}"
    _bootstrap_pg_hba_missing_ips: >-
      {{ (([primary_ip] + (standby_ips | default([]))) | unique)
         | map('regex_replace', '^(.*)$', '\g<1>/32')
         | reject('in', _joined)
         | map('regex_replace', '/32$', '')
         | list }}
    # Heals clusters whose live pg_hba predates the loopback/app-user/
    # control-plane template entries (or lost them): Patroni's own heartbeat
    # needs loopback, the app user connects only via the proxy, and the
    # erawan control plane (same node as the proxy) needs superuser access
    # for user/database management.
    _bootstrap_pg_hba_extra: >-
      {{
        (['host all all 127.0.0.1/32 scram-sha-256'] if '127.0.0.1/32' not in _joined else [])
        + (['host all all ::1/128 scram-sha-256'] if '::1/128' not in _joined else [])
        + (['host all all ' ~ proxy_allowed_ip ~ '/32 scram-sha-256']
           if ('all all ' ~ proxy_allowed_ip ~ '/32') not in _joined else [])
        + ((
            ['hostssl all ' ~ new_user ~ ' ' ~ proxy_allowed_ip ~ '/32 scram-sha-256',
             'hostnossl all ' ~ new_user ~ ' ' ~ proxy_allowed_ip ~ '/32 reject']
            if (new_user_ssl_required | default(true) | bool)
            else ['host all ' ~ new_user ~ ' ' ~ proxy_allowed_ip ~ '/32 scram-sha-256']
          )
          if (((new_user | default('')) | length > 0)
              and ((new_user ~ ' ' ~ proxy_allowed_ip ~ '/32') not in _joined))
          else [])
      }}
  vars:
    _hba_base: >-
      {{
        (_bootstrap_patroni_config.json.postgresql.pg_hba | default([]))
        if ((_bootstrap_patroni_config.json.postgresql.pg_hba | default([])) | length > 0)
        else (
          (_bootstrap_hba_file.content | b64decode).splitlines()
          | map('trim')
          | select('match', '^(local|host)')
          | list
        )
      }}
    _joined: "{{ _hba_base | join('\n') }}"
  no_log: true
  when: inventory_hostname in groups['pgsql_primary']
  tags: ["cluster_bootstrap"]

- name: Reconcile pg_hba with current cluster members
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ patroni_rest_port }}/config"
    method: PATCH
    body_format: json
    body:
      postgresql:
        pg_hba: >-
          {{
            _bootstrap_pg_hba_base
            + _bootstrap_pg_hba_extra
            + (_bootstrap_pg_hba_missing_ips
               | map('regex_replace', '^(.*)$',
                     'host replication ' ~ replication_user ~ ' \g<1>/32 scram-sha-256')
               | list)
            + (_bootstrap_pg_hba_missing_ips
               | map('regex_replace', '^(.*)$', 'host all all \g<1>/32 scram-sha-256')
               | list)
          }}
    status_code: [200]
  no_log: true
  when:
    - inventory_hostname in groups['pgsql_primary']
    - (_bootstrap_pg_hba_missing_ips | length > 0) or (_bootstrap_pg_hba_extra | length > 0)
  tags: ["cluster_bootstrap"]

- name: Start Patroni on standby nodes
  ansible.builtin.systemd:
    name: patroni
    enabled: true
    state: started
  when: inventory_hostname in groups['pgsql_standby']
  throttle: 1
  tags: ["cluster_bootstrap"]

# block/rescue mirrors the primary pattern for standby nodes.
- name: Bootstrap Patroni standbys and verify replica state
  when: inventory_hostname in groups['pgsql_standby']
  tags: ["cluster_bootstrap"]
  block:
    - name: Wait for Patroni REST port to open on standbys
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ patroni_rest_port }}"
        state: started
        timeout: "{{ patroni_replica_port_open_timeout }}"

    # The mirror of the primary wait above, and wrong for the same reason if
    # written as `/replica` returns 200: that endpoint answers 200 only on a
    # node that is NOT the leader. After a failover the roles in the stored
    # spec are simply swapped — the node filed here as standby_1 holds the
    # leader lock and the stored primary streams from it — and a cluster in
    # that state is healthy, not broken. Demanding a replica role here failed
    # the recover of a cluster whose own /replica body showed
    # `"role": "primary"` with the other node streaming `sync`.
    #
    # It also cannot pass by waiting, so the whole retry budget is spent before
    # the failure: a deploy looks fast only because the stored primary really
    # is the leader on a first deploy, which stops being true after any scale.
    #
    # So this asserts what bootstrap actually needs on every node, whatever
    # role it currently holds: the cluster has a leader, and this node is a
    # running member of it. Same condition as the primary, deliberately.
    - name: Wait for this node to join a cluster that has a leader
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ patroni_rest_port }}/cluster"
        return_content: true
      register: _patroni_replica
      until: >-
        ((_patroni_replica.json | default({})).members | default([])
         | selectattr('role', 'in', ['leader', 'standby_leader'])
         | list | length > 0)
        and
        ((_patroni_replica.json | default({})).members | default([])
         | selectattr('host', 'equalto', ansible_host)
         | selectattr('state', 'in', ['running', 'streaming'])
         | list | length > 0)
      retries: "{{ patroni_replica_retries }}"
      delay: "{{ patroni_replica_delay }}"
      changed_when: false
  rescue:
    - name: Collect Patroni journal on standby bootstrap failure
      ansible.builtin.command:
        argv: [journalctl, -u, patroni, --no-pager, -n, 80]
      register: _patroni_standby_journal
      changed_when: false
      failed_when: false

    - name: Fail with Patroni log context on standbys
      ansible.builtin.fail:
        msg: |
          {{ inventory_hostname }} never became a running member of a cluster
          with a leader. Note that holding the leader lock is NOT this failure:
          after a failover the stored roles are swapped and that is healthy.
          Last Patroni cluster view: {{ (_patroni_replica | default({})).json | default('(not reached)') }}
          Last 80 Patroni journal lines:
          {{ _patroni_standby_journal.stdout | default('(no journal output)') }}

# Same journal-on-failure pattern as the primary wait above.
- name: Wait for PostgreSQL to accept connections on standbys
  when: inventory_hostname in groups['pgsql_standby']
  tags: ["cluster_bootstrap"]
  block:
    - name: Wait for PostgreSQL to listen on standbys
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ postgres_port }}"
        state: started
        timeout: 180
  rescue:
    - name: Collect Patroni journal on standby PostgreSQL startup failure
      ansible.builtin.command:
        argv: [journalctl, -u, patroni, --no-pager, -n, 80]
      register: _pg_standby_journal
      changed_when: false
      failed_when: false

    - name: Fail with PostgreSQL startup log context on standbys
      ansible.builtin.fail:
        msg: |
          PostgreSQL did not open port {{ postgres_port }} on {{ inventory_hostname }}.
          Last 80 Patroni journal lines:
          {{ _pg_standby_journal.stdout | default('(no journal output)') }}
